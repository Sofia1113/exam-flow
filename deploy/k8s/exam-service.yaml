# exam-service 部署清单示例(核心服务,双可用区)
# 生产环境按 TDD §9 部署:核心服务 3 副本跨可用区,HPA 自动扩缩
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-service
  namespace: examflow
  labels:
    app: exam-service
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0      # 滚动期间不允许不可用(考试场景)
      maxSurge: 1
  selector:
    matchLabels:
      app: exam-service
  template:
    metadata:
      labels:
        app: exam-service
    spec:
      # 跨可用区打散(TDD §9 双可用区)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
      containers:
        - name: exam-service
          image: harbor.example.gov.cn/examflow/exam-service:1.0.0
          ports:
            - containerPort: 8086
          env:
            - name: EXAMSECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: examflow-secrets
                  key: exam-secret-key
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: exam-service
  namespace: examflow
spec:
  selector:
    app: exam-service
  ports:
    - port: 8086
      targetPort: 8086
---
# 按 CPU 自动扩缩(考试高峰弹性,上限 10 副本)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: exam-service
  namespace: examflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: exam-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
