# exam-flow Nginx 入口配置(生产 HTTPS 反代示例)
# 结构:静态站点(portal/admin/exam-client)→ 网关(8080)→ 微服务
# 依据 TDD §2.1 接入与安全层:WAF → Nginx(HTTPS 终结)→ 网关

# HTTP 跳转 HTTPS
server {
    listen 80;
    server_name exam.example.gov.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name exam.example.gov.cn;

    # 证书(等保要求 TLS1.2+)
    ssl_certificate     /etc/nginx/certs/exam.example.gov.cn.crt;
    ssl_certificate_key /etc/nginx/certs/exam.example.gov.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    add_header          Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;  # 答卷附件上传上限(题目附件 10MB)

    # 考生门户静态站点
    location / {
        root /data/sites/portal;
        try_files $uri $uri/ /index.html;
    }

    # 管理后台(独立域名或路径,生产建议独立子域)
    # location /admin/ {
    #     alias /data/sites/admin/;
    #     try_files $uri $uri/ /admin/index.html;
    # }

    # API 网关转发
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # 考试接口(保存/交卷/心跳)超时放宽
        location ~ ^/api/v1/exam/.*/(answers|heartbeat|submit) {
            proxy_pass http://127.0.0.1:8080;
            proxy_read_timeout 60s;
        }
    }
}
