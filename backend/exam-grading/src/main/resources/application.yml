server:
  port: 8088

# paper-service 地址(生产注册 Nacos 后由服务发现替换)
examflow:
  paper-service-url: ${PAPER_SERVICE_URL:http://127.0.0.1:8084}

spring:
  application:
    name: exam-grading
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/exam_flow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: ${DB_PASSWORD:root}   # 生产环境通过环境变量注入
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

# RocketMQ(消费"交卷完成"事件触发判分)
rocketmq:
  name-server: 127.0.0.1:9876
  consumer:
    group: grading-consumer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.examflow: info

# Feign 超时(避免默认 10s×5 重试导致链路卡顿)
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 10000
