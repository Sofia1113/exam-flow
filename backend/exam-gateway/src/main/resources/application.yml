server:
  port: 8080

# 安全基线:鉴权默认开启(fail-closed,JWT 校验实现前拒绝一切非白名单请求)。
# 本地联调可临时设 false,严禁用于生产。
examflow:
  security:
    auth-enabled: true

spring:
  application:
    name: exam-gateway
  cloud:
    gateway:
      routes:
        # 骨架:静态转发示例;生产环境配合 Nacos 注册中心使用 lb://exam-auth 负载均衡
        - id: exam-auth
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: exam-exam
          uri: http://127.0.0.1:8086
          predicates:
            - Path=/api/v1/exam/**,/api/v1/proctor/**

    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

logging:
  level:
    com.examflow: info
