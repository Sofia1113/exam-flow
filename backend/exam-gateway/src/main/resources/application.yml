server:
  port: 8080

# 安全基线:鉴权默认开启;本地联调可临时设 false,严禁用于生产。
examflow:
  security:
    auth-enabled: true
  # JWT 校验配置:与 auth 服务共享同一密钥(生产经 JWT_SECRET 注入,≥ 32 字节)
  jwt:
    secret: ${JWT_SECRET:exam-flow-dev-jwt-secret-key-0123456789abcdef}
    blacklist-prefix: examflow:jwt:blacklist

spring:
  application:
    name: exam-gateway
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  cloud:
    # Nacos 注册中心:本地默认关闭;生产启用时改为 enabled: true 并配置 server-addr,
    # 路由 uri 同步改为 lb://服务名
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      # 服务地址参数化:本地默认直连各服务端口;
      # 生产环境取消下方 Nacos 配置后,将 uri 改为 lb://服务名(如 lb://exam-auth)自动负载均衡
      routes:
        - id: exam-auth
          uri: ${SERVICE_AUTH_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: exam-user
          uri: ${SERVICE_USER_URI:http://127.0.0.1:8082}
          predicates:
            - Path=/api/v1/users/**,/api/v1/orgs/**
        - id: exam-question
          uri: ${SERVICE_QUESTION_URI:http://127.0.0.1:8083}
          predicates:
            - Path=/api/v1/questions/**
        - id: exam-paper
          uri: ${SERVICE_PAPER_URI:http://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/papers/**
        - id: exam-registration
          uri: ${SERVICE_REGISTRATION_URI:http://127.0.0.1:8085}
          predicates:
            - Path=/api/v1/registration/**
        # 考试服务:核心链路(保存/交卷/心跳),生产建议独立路由组并放大超时
        - id: exam-service
          uri: ${SERVICE_EXAM_URI:http://127.0.0.1:8086}
          predicates:
            - Path=/api/v1/exam/**
        - id: exam-proctor
          uri: ${SERVICE_PROCTOR_URI:http://127.0.0.1:8087}
          predicates:
            - Path=/api/v1/proctor/**
        - id: exam-grading
          uri: ${SERVICE_GRADING_URI:http://127.0.0.1:8088}
          predicates:
            - Path=/api/v1/grading/**
        - id: exam-report
          uri: ${SERVICE_REPORT_URI:http://127.0.0.1:8089}
          predicates:
            - Path=/api/v1/reports/**
        - id: exam-message
          uri: ${SERVICE_MESSAGE_URI:http://127.0.0.1:8090}
          predicates:
            - Path=/api/v1/messages/**
        - id: exam-sys
          uri: ${SERVICE_SYS_URI:http://127.0.0.1:8091}
          predicates:
            - Path=/api/v1/sys/**
      globalcors:
        cors-configurations:
          '[/**]':
            # 安全基线:严禁 allowCredentials: true 与 "*" 通配符组合;
            # 仅允许实际前端站点来源(本地 Vite 端口 + 生产域名,按需增删)
            allowedOriginPatterns:
              - http://localhost:5173
              - http://localhost:5174
              - http://localhost:5175
              - https://exam.example.gov.cn
              - https://admin.example.gov.cn
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
      # 等保基础安全响应头(TDD §7.6)
      default-filters:
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=Cache-Control, no-store

logging:
  level:
    com.examflow: info
