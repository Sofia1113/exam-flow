server:
  port: 8083

spring:
  application:
    name: exam-question
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/exam_flow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: ${DB_PASSWORD:root}   # 生产环境通过环境变量注入
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.examflow: info

# Feign 超时(避免默认 10s×5 重试导致链路卡顿)
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 10000
